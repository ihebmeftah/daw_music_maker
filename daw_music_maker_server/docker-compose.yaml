services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: daw_music_maker
      POSTGRES_PASSWORD: "TDnw5PrA8G3ahoBkoiBRlPFuMA1Zrzo5"
    volumes:
      - daw_music_maker_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "2jc_OsS_NGm3UvawNZP_mZChQ7qPFVqX"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: daw_music_maker_test
      POSTGRES_PASSWORD: "pwsA1A1obBIMFE9A8d-dHv1GUwP86KQ_"
    volumes:
      - daw_music_maker_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "-TUUAPYTygaE7zQTTUGNkVO_72aotqG_"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  daw_music_maker_data:
  daw_music_maker_test_data:
