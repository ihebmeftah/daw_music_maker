### An audio file uploaded to a project (stored in private cloud storage).
class: Sample
serverOnly: true
table: sample
fields:
  ### Primary key, generated by the database (UUID v7).
  id: UuidValue?, defaultPersist=random_v7
  ### The project; samples are deleted with it.
  projectId: UuidValue, relation(parent=project, onDelete=Cascade)
  ### Display name (file name without extension), 1–80 chars.
  name: String
  ### File format (checked against the file's bytes).
  format: AudioFormat
  ### File size in bytes (≤ 10 MB).
  sizeBytes: int
  ### Duration in milliseconds, if known.
  durationMs: int?
  ### Waveform outline (200 peaks, 0–1) for WAV files.
  peaks: List<double>?
  ### Server-generated storage path in the private storage.
  storagePath: String
  ### The user who uploaded it.
  uploadedById: UuidValue
  ### Upload time.
  createdAt: DateTime, default=now
indexes:
  sample_project_idx:
    fields: projectId
  sample_path_idx:
    fields: storagePath
    unique: true
