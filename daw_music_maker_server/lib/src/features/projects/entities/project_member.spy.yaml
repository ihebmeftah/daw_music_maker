### A user (other than the owner) who collaborates on a project.
class: ProjectMember
serverOnly: true
table: project_member
fields:
  ### Primary key, generated by the database (UUID v7).
  id: UuidValue?, defaultPersist=random_v7
  ### The project; members are deleted with it.
  projectId: UuidValue, relation(name=project_members, parent=project, onDelete=Cascade)
  ### The member's auth user id.
  userId: UuidValue
  ### What the member may do.
  role: ProjectRole
  ### When the member joined.
  createdAt: DateTime, default=now
  ### Last role change.
  updatedAt: DateTime, default=now
indexes:
  project_member_unique_idx:
    fields: projectId, userId
    unique: true
  project_member_user_idx:
    fields: userId
