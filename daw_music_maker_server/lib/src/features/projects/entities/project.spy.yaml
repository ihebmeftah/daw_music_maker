### A music project owned by a user.
class: Project
serverOnly: true
table: project
fields:
  ### Primary key, generated by the database (UUID v7).
  id: UuidValue?, defaultPersist=random_v7
  ### The auth user that owns the project.
  ownerId: UuidValue
  ### Display name, 1–80 chars, trimmed.
  name: String
  ### Free-text description, 0–1000 chars, trimmed.
  description: String, default=''
  ### Genre tags (max 8, each 1–24 chars, unique case-insensitively).
  genres: List<String>
  ### Who can see the project.
  visibility: ProjectVisibility, default=private
  ### Whether the owner accepts collaborators (invitations and join requests).
  allowContributions: bool, default=false
  ### Tempo in beats per minute (20–999, up to 2 decimals).
  bpm: double, default=120.0
  ### Members of the project (excluding the owner).
  members: List<ProjectMember>?, relation(name=project_members)
  ### Creation time.
  createdAt: DateTime, default=now
  ### Last modification time.
  updatedAt: DateTime, default=now
indexes:
  project_owner_idx:
    fields: ownerId
  project_visibility_idx:
    fields: visibility, updatedAt
