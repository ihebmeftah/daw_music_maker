### A pending request from a user to join a public project that is open to
### contributions. Deleted when accepted, declined or cancelled.
class: ProjectJoinRequest
serverOnly: true
table: project_join_request
fields:
  ### Primary key, generated by the database (UUID v7).
  id: UuidValue?, defaultPersist=random_v7
  ### The project; requests are deleted with it.
  projectId: UuidValue, relation(parent=project, onDelete=Cascade)
  ### The requesting auth user.
  userId: UuidValue
  ### Role the user asks for.
  role: ProjectRole
  ### When the request was sent.
  createdAt: DateTime, default=now
  ### Last change (e.g. role updated by re-requesting).
  updatedAt: DateTime, default=now
indexes:
  project_join_request_unique_idx:
    fields: projectId, userId
    unique: true
  project_join_request_user_idx:
    fields: userId
