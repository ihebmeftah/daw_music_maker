### A playlist clip as seen by the client.
class: ClipResponse
fields:
  ### Clip id.
  id: UuidValue
  ### The pattern it plays (pattern clips).
  patternId: UuidValue?
  ### The sample it plays (audio clips).
  sampleId: UuidValue?
  ### Length in bars (audio clips).
  lengthBars: int?
  ### Track (row).
  track: int
  ### Start in steps (1/16 notes) from the song start, 0–4095.
  startStep: int
